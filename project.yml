# XcodeGen project spec. Regenerate the Xcode project with:
#   xcodegen generate
# (see README.md; the generated CallNotes.xcodeproj is not committed)
name: CallNotes
options:
  bundleIdPrefix: com.thatdudealso
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic

packages:
  CallNotesCore:
    path: Packages/CallNotesCore

targets:
  CallNotesMac:
    type: application
    platform: macOS
    sources:
      - CallNotesMac/Sources
      - path: Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: CallNotesCore
    settings:
      base:
        PRODUCT_NAME: CallNotes
        PRODUCT_BUNDLE_IDENTIFIER: com.thatdudealso.callnotes
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSMicrophoneUsageDescription: CallNotes records your calls locally so it can transcribe them and generate notes. Audio never leaves this Mac unless you enable the cloud engine.
        INFOPLIST_KEY_NSAudioCaptureUsageDescription: CallNotes captures the other side of your calls from system audio so it can transcribe them locally. Audio never leaves this Mac unless you enable the cloud engine.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: CallNotes optionally looks at calendar events with a phone or FaceTime link so it can start recording as the call begins.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: CallNotes transcribes your calls on this Mac using on-device speech recognition. Audio stays on this device unless you enable the cloud engine.
        ENABLE_HARDENED_RUNTIME: true
        # Process taps and local Postgres sockets rule out the App Sandbox
        # (plan section 12); hardened runtime stays on.
        ENABLE_APP_SANDBOX: false

  # Compatibility launcher (vendored from Megaphone): ships as the bundle's
  # main executable so pre-macOS-26 machines get a clear requirement message
  # instead of Launch Services error -10825. Wired into the app bundle by the
  # release pipeline (Scripts/release), not by the debug build.
  CallNotesLauncher:
    type: tool
    platform: macOS
    sources:
      - CallNotesMac/Launcher
    settings:
      base:
        # The launcher must run on old systems to explain the macOS 26
        # requirement, so it deploys back further than the app itself.
        MACOSX_DEPLOYMENT_TARGET: "13.0"

  CallNotesIOS:
    type: application
    platform: iOS
    sources:
      - CallNotesIOS/Sources
    dependencies:
      - package: CallNotesCore
      - target: CallNotesShareExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: CallNotes
        PRODUCT_BUNDLE_IDENTIFIER: com.thatdudealso.callnotes.ios
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSMicrophoneUsageDescription: CallNotes records in-person meetings you start and uploads them to your Mac for transcription.
        INFOPLIST_KEY_NSCameraUsageDescription: CallNotes scans the pairing QR code shown on your Mac so it can pin that Mac’s certificate.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: CallNotes talks only to your own Mac on your local network to sync calls and notes.
        INFOPLIST_KEY_UIBackgroundModes: [audio, processing]
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers: [com.thatdudealso.callnotes.upload]
        CODE_SIGN_ENTITLEMENTS: CallNotesIOS/CallNotesIOS.entitlements

  CallNotesCaptureHarness:
    type: tool
    platform: macOS
    sources:
      - path: Tests/CaptureHarness
      - path: CallNotesMac/Sources/Capture
        excludes:
          - CaptureCoordinator.swift
          - CallDetector.swift
          - CallAppIdentityStore.swift
          - CalendarArmSignal.swift
          - RecordingState.swift
    dependencies:
      - target: CallNotesCaptureHarnessPlayback
      - package: CallNotesCore
    settings:
      base:
        PRODUCT_NAME: CallNotesCaptureHarness
        PRODUCT_BUNDLE_IDENTIFIER: com.thatdudealso.callnotes.capture-harness
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSMicrophoneUsageDescription: The CallNotes capture harness records the microphone to verify the near channel of a two-channel CAF.
        INFOPLIST_KEY_NSAudioCaptureUsageDescription: The CallNotes capture harness records system audio to verify the far channel of a two-channel CAF.
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_APP_SANDBOX: false
        SWIFT_EMIT_LOC_STRINGS: false

  CallNotesCaptureHarnessPlayback:
    type: tool
    platform: macOS
    sources:
      - Tests/CaptureHarnessPlayback
    settings:
      base:
        PRODUCT_NAME: CallNotesCaptureHarnessPlayback
        PRODUCT_BUNDLE_IDENTIFIER: com.thatdudealso.callnotes.capture-harness-playback
        GENERATE_INFOPLIST_FILE: true
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_APP_SANDBOX: false
        SWIFT_EMIT_LOC_STRINGS: false

  CallNotesShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - CallNotesIOS/ShareExtension/Sources
    dependencies:
      - package: CallNotesCore
    info:
      path: CallNotesIOS/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: CallNotes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatdudealso.callnotes.ios.ShareExtension
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_ENTITLEMENTS: CallNotesIOS/ShareExtension/CallNotesShareExtension.entitlements

schemes:
  CallNotesMac:
    build:
      targets:
        CallNotesMac: all
    run:
      config: Debug
  CallNotesIOS:
    build:
      targets:
        CallNotesIOS: all
    run:
      config: Debug
  CallNotesCaptureHarness:
    build:
      targets:
        CallNotesCaptureHarness: all
    run:
      config: Debug
